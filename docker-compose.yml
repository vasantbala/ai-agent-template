services:
  agent:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      langfuse:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  langfuse:
    image: langfuse/langfuse:2
    ports:
      - "3001:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3001
      SALT: dev-salt-change-in-production
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://' + require('os').hostname() + ':3000/api/public/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  langfuse-db:
  qdrant-data:
