[project]
name = "ai-agent-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "litellm>=1.40",
    "fastapi[standard]>=0.111",
    "pydantic-settings>=2.3",
    "langfuse>=2.30",
    "mcp>=1.0",
    "guardrails-ai>=0.5",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "qdrant-client[fastembed]>=1.9",
    "deepeval>=4.0.6",
    "httpx>=0.27",
    "apscheduler>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "functional: real LLM call, requires valid .env credentials",
    "eval: golden dataset evaluation suite, requires live LLM and .env credentials",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
